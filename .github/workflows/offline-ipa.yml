name: Offline IPA (local accounts can install the game)

# Manual only: press the button, or push to the `build-ipa` branch (same thing, but
# scriptable). Nothing ever builds on its own from normal commits.
on:
  workflow_dispatch:
  push:
    branches:
      - build-ipa

permissions:
  contents: write

env:
  # Insurance for the CMake 4.x that ships on GitHub's macOS images: older CMakeLists
  # files that declare a minimum below 3.5 would otherwise be rejected. Ignored by CMake 3.x.
  CMAKE_POLICY_VERSION_MINIMUM: "3.5"

jobs:
  ios_ipa:
    name: Build the iOS .ipa
    runs-on: macos-26
    timeout-minutes: 120
    steps:
      - name: Check out this repository
        uses: actions/checkout@v4

      - name: Check out submodules
        run: git submodule update --init --recursive

      - name: Install GNU make and ldid (the Makefile requires both)
        run: brew install make ldid

      - name: Install Azul Zulu JDK 8 (launcher.jar must be compiled with javac 8)
        run: |
          set -euo pipefail
          ZULU=zulu8.98.0.107-ca-jdk8.0.512-macosx_aarch64
          curl -fL --retry 3 -o "$RUNNER_TEMP/jdk8.tar.gz" "https://cdn.azul.com/zulu/bin/$ZULU.tar.gz"
          mkdir -p "$RUNNER_TEMP/jdk8"
          tar -xzf "$RUNNER_TEMP/jdk8.tar.gz" -C "$RUNNER_TEMP/jdk8"
          JAVAC="$(find "$RUNNER_TEMP/jdk8" -type f -name javac | head -n 1)"
          test -n "$JAVAC"
          echo "BOOTJDK_DIR=$(dirname "$JAVAC")" >> "$GITHUB_ENV"
          echo "JAVA_HOME=$(dirname "$(dirname "$JAVAC")")" >> "$GITHUB_ENV"
          "$JAVAC" -version

      - name: Build (same recipe as upstream's nightly build)
        run: |
          set -euo pipefail
          export PATH=/opt/homebrew/bin:$PATH
          gmake -j"$(sysctl -n hw.ncpu)" dsym package PLATFORM=2 BOOTJDK="$BOOTJDK_DIR" 2>&1 | tee "$RUNNER_TEMP/build.log"

      # The Actions log is only readable by someone signed in, so keep a copy of the
      # interesting part where anyone can read it.
      - name: Publish the build log when the build fails
        if: failure()
        run: |
          set -uo pipefail
          LOG="$RUNNER_TEMP/build.log"
          if [ ! -f "$LOG" ]; then echo "the build produced no log at all" > "$LOG"; fi
          tail -n 500 "$LOG" > ci-build-log.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f ci-build-log.txt
          git diff --staged --quiet || git commit -m "CI: build log from the failed IPA build"
          git push -f origin "HEAD:refs/heads/build-logs"

      - name: Upload the .ipa - this is the file to put on the iPad
        uses: actions/upload-artifact@v4
        with:
          name: amethyst-offline-ios
          path: artifacts/org.angelauramc.amethyst-*-ios.ipa
          if-no-files-found: error
          retention-days: 30

      - name: Upload the Java runtimes separately (only needed for a slimmed build)
        uses: actions/upload-artifact@v4
        with:
          name: amethyst-offline-java_runtimes
          path: artifacts/java_runtimes.zip
          retention-days: 30
